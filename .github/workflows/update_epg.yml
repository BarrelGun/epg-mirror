name: Update EPG

on:
  schedule:
    # Запуск каждые 8 часов
    - cron: '0 */8 * * *'
  workflow_dispatch: # Позволяет запускать обновление вручную кнопкой

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download EPG files
        run: |
          curl -L "https://iptvx.one/epg/epg.xml.gz" -o epg.xml.gz
          curl -L "http://epg.one/edem.xml.gz" -o edem.xml.gz

      - name: Commit and push to GitHub
        run: |
          git config --global user.name "EPG Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add epg.xml.gz edem.xml.gz
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update EPG: $(date +'%Y-%m-%d %H:%M')" && git push)

      - name: Upload to Yandex Disk via WebDAV
        env:
          YANDEX_USER: ${{ secrets.YANDEX_USER }}
          YANDEX_PASS: ${{ secrets.YANDEX_PASS }}
        run: |
          # Загрузка файлов в корень Яндекс.Диска по WebDAV
          curl -s -S -X PUT -u "$YANDEX_USER:$YANDEX_PASS" --data-binary @"epg.xml.gz" "https://webdav.yandex.ru/epg.xml.gz"
          curl -s -S -X PUT -u "$YANDEX_USER:$YANDEX_PASS" --data-binary @"edem.xml.gz" "https://webdav.yandex.ru/edem.xml.gz"
