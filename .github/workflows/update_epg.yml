name: Update EPG

on:
  schedule:
    # Запуск каждые 8 часов
    - cron: '0 */8 * * *'
  workflow_dispatch: # Позволяет запускать обновление вручную

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download EPG files
        run: |
          curl -L "https://iptvx.one/epg/epg.xml.gz" -o epg.xml.gz
          curl -L "http://epg.one/edem.xml.gz" -o edem.xml.gz

      - name: Commit and push to GitHub
        run: |
          git config --global user.name "EPG Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add epg.xml.gz edem.xml.gz
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update EPG: $(date +'%Y-%m-%d %H:%M')" && git push)

      - name: Setup Rclone & Upload to Yandex Disk
        env:
          YANDEX_USER: ${{ secrets.YANDEX_USER }}
          YANDEX_PASS: ${{ secrets.YANDEX_PASS }}
        run: |
          # Устанавливаем rclone
          sudo apt-get update && sudo apt-get install -y rclone

          # Создаем временный конфиг для подключения к Яндекс.Диску по WebDAV
          mkdir -p ~/.config/rclone
          cat <<EOF > ~/.config/rclone/rclone.conf
          [yandex]
          type = webdav
          url = https://webdav.yandex.ru
          vendor = rclone
          user = $YANDEX_USER
          pass = $(rclone obscure "$YANDEX_PASS")
          EOF

          # Загружаем файлы в папку epg на Яндекс.Диске с оптимизацией и тайм-аутом
          rclone copy epg.xml.gz yandex:/epg/ --timeout 3m --retries 3 --low-level-retries 5
          rclone copy edem.xml.gz yandex:/epg/ --timeout 3m --retries 3 --low-level-retries 5
