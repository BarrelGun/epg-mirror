name: Update EPG

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check file sizes and download if changed
        run: |
          REMOTE_SIZE_1=$(curl -sI "https://iptvx.one/epg/epg.xml.gz" | grep -i "Content-Length" | awk '{print $2}' | tr -d '\r')
          LOCAL_SIZE_1=$(stat -c%s "epg.xml.gz" 2>/dev/null || echo 0)

          echo "EPG 1 - Remote: $REMOTE_SIZE_1, Local: $LOCAL_SIZE_1"

          if [ "$REMOTE_SIZE_1" != "$LOCAL_SIZE_1" ] || [ "$REMOTE_SIZE_1" = "" ]; then
            echo "EPG 1 changed. Downloading..."
            curl -L "https://iptvx.one/epg/epg.xml.gz" -o epg.xml.gz
          else
            echo "EPG 1 size is identical. Skipping download."
          fi

          REMOTE_SIZE_2=$(curl -sI "http://epg.one/edem.xml.gz" | grep -i "Content-Length" | awk '{print $2}' | tr -d '\r')
          LOCAL_SIZE_2=$(stat -c%s "edem.xml.gz" 2>/dev/null || echo 0)

          echo "EPG 2 - Remote: $REMOTE_SIZE_2, Local: $LOCAL_SIZE_2"

          if [ "$REMOTE_SIZE_2" != "$LOCAL_SIZE_2" ] || [ "$REMOTE_SIZE_2" = "" ]; then
            echo "EPG 2 changed. Downloading..."
            curl -L "http://epg.one/edem.xml.gz" -o edem.xml.gz
          else
            echo "EPG 2 size is identical. Skipping download."
          fi

      - name: Commit and push to GitHub
        run: |
          git config --global user.name "EPG Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add epg.xml.gz edem.xml.gz
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update EPG: $(date +'%Y-%m-%d %H:%M')" && git push)
