name: Update EPG Mirror

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download EPG 1 (epg.xml.gz)
        run: |
          echo "Downloading epg.xml.gz..."
          curl -s -O https://iptvx.one/epg/epg.xml.gz
          NEW_LEN=$(curl -sI https://iptvx.one/epg/epg.xml.gz | grep -i Content-Length | awk '{print $2}' | tr -d '\r')
          echo "$NEW_LEN" > epg1_len.txt

      - name: Download EPG 2 (edem.xml.gz)
        run: |
          echo "Downloading edem.xml.gz..."
          curl -s -O https://epg.one/edem.xml.gz
          NEW_LEN=$(curl -sI https://epg.one/edem.xml.gz | grep -i Content-Length | awk '{print $2}' | tr -d '\r')
          echo "$NEW_LEN" > epg2_len.txt

      - name: Upload files to GitLab Generic Packages
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [ -f epg.xml.gz ]; then
            echo "Uploading epg.xml.gz to GitLab..."
            curl -f --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
                 --upload-file epg.xml.gz \
                 "https://gitlab.com/api/v4/projects/BarrelGun%2Fepg-mirror/packages/generic/epg/1.0.0/epg.xml.gz"
          fi

          if [ -f edem.xml.gz ]; then
            echo "Uploading edem.xml.gz to GitLab..."
            curl -f --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
                 --upload-file edem.xml.gz \
                 "https://gitlab.com/api/v4/projects/BarrelGun%2Fepg-mirror/packages/generic/epg/1.0.0/edem.xml.gz"
          fi

      - name: Upload files to Yandex Disk (WebDAV)
        env:
          YANDEX_USER: ${{ secrets.YANDEX_USER }}
          YANDEX_PASS: ${{ secrets.YANDEX_PASS }}
        run: |
          if [ -f epg.xml.gz ]; then
            echo "Uploading epg.xml.gz to Yandex Disk..."
            curl -f --retry 3 --user "$YANDEX_USER:$YANDEX_PASS" \
                 -T epg.xml.gz \
                 "https://webdav.yandex.ru/epg/epg.xml.gz"
          fi

          if [ -f edem.xml.gz ]; then
            echo "Uploading edem.xml.gz to Yandex Disk..."
            curl -f --retry 3 --user "$YANDEX_USER:$YANDEX_PASS" \
                 -T edem.xml.gz \
                 "https://webdav.yandex.ru/epg/edem.xml.gz"
          fi

      - name: Commit state changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add epg1_len.txt epg2_len.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "Update EPG metadata [skip ci]"
          git push
