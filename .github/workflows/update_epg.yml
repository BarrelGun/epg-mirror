- name: Check and download EPG 2 (edem.xml.gz)
        id: check_epg2
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          NEW_LEN=$(curl -sLI -H "User-Agent: $UA" https://epg.one/edem.xml.gz | grep -i Content-Length | tail -n1 | awk '{print $2}' | tr -d '\r')
          OLD_LEN=""
          [ -f epg2_len.txt ] && OLD_LEN=$(cat epg2_len.txt)
          
          if [ "${{ inputs.force_update }}" = "true" ] || ([ -n "$NEW_LEN" ] && [ "$NEW_LEN" != "$OLD_LEN" ]); then
            echo "EPG2 changed or force requested. Downloading..."
            # Добавлен ключ -L для перехода по редиректам
            curl -sL -H "User-Agent: $UA" -o /tmp/edem.xml.gz https://epg.one/edem.xml.gz
            
            # Проверяем, что файл действительно скачался большим (больше 10 КБ), а не превратился в заглушку 145 байт
            FILE_SIZE=$(wc -c < /tmp/edem.xml.gz)
            if [ "$FILE_SIZE" -gt 10000 ]; then
              echo "$NEW_LEN" > epg2_len.txt
              echo "EPG2_CHANGED=true" >> $GITHUB_ENV
            else
              echo "Error: Downloaded file is too small ($FILE_SIZE bytes). Skipping update."
              echo "EPG2_CHANGED=false" >> $GITHUB_ENV
            fi
          else
            echo "EPG2 not changed."
            echo "EPG2_CHANGED=false" >> $GITHUB_ENV
          fi
