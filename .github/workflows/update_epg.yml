
name: Update EPG Mirror

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Принудительно обновить EPG'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-epg-mirror
  cancel-in-progress: false

jobs:
  update-epg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Скачиваем и проверяем каждый источник независимо.
      - name: Download and validate EPG files
        id: download
        shell: bash
        run: |
          set -u

          mkdir -p "$RUNNER_TEMP/epg"

          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36"

          download_one() {
            local key="$1"
            local filename="$2"
            local url="$3"
            local dest="$RUNNER_TEMP/epg/$filename"

            echo "Checking $filename ..."

            if ! curl --fail --location --silent --show-error \
              --retry 3 --retry-all-errors \
              --connect-timeout 20 --max-time 300 \
              -A "$UA" "$url" -o "$dest"; then
              echo "Download failed: $filename"
              rm -f "$dest"
              echo "${key}_ok=false" >> "$GITHUB_OUTPUT"
              return
            fi

            local size
            size=$(wc -c < "$dest")

            if [ "$size" -le 10000 ]; then
              echo "File is too small: $size bytes"
              rm -f "$dest"
              echo "${key}_ok=false" >> "$GITHUB_OUTPUT"
              return
            fi

            if ! gzip -t "$dest"; then
              echo "Invalid gzip archive: $filename"
              rm -f "$dest"
              echo "${key}_ok=false" >> "$GITHUB_OUTPUT"
              return
            fi

            if ! python3 -c \
              'import gzip,re,sys; d=gzip.open(sys.argv[1],"rb").read(2097152); sys.exit(0 if re.search(rb"<tv(?:\s|>)",d) else 1)' \
              "$dest"; then
              echo "XMLTV <tv> element not found: $filename"
              rm -f "$dest"
              echo "${key}_ok=false" >> "$GITHUB_OUTPUT"
              return
            fi

            local hash
            hash=$(sha256sum "$dest" | awk '{print $1}')

            echo "$filename downloaded: $size bytes"
            echo "SHA256: $hash"

            echo "${key}_ok=true" >> "$GITHUB_OUTPUT"
            echo "${key}_sha=$hash" >> "$GITHUB_OUTPUT"
          }

          download_one epg1 epg.xml.gz \
            https://iptvx.one/epg/epg.xml.gz

          download_one epg2 edem.xml.gz \
            http://epg.one/edem.xml.gz

          if [ "$(grep -c '=true' "$GITHUB_OUTPUT" || true)" -eq 0 ]; then
            echo "Neither EPG source produced a valid archive."
            exit 1
          fi

      # Публикация в Cloud.ru.
      - name: Publish to Cloud.ru Object Storage
        if: steps.download.outputs.epg1_ok == 'true' || steps.download.outputs.epg2_ok == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDRU_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDRU_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central-1
          AWS_EC2_METADATA_DISABLED: "true"
          FORCE_UPDATE: ${{ github.event.inputs.force_update || 'false' }}
        shell: bash
        run: |
          set -u

          if ! command -v aws >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y awscli
          fi

          FAILED=0

          publish_one() {
            local filename="$1"
            local hash="$2"
            local local_file="$RUNNER_TEMP/epg/$filename"

            echo "Checking Cloud.ru object: $filename"

            local remote_hash
            remote_hash=$(aws s3api head-object \
              --endpoint-url https://s3.cloud.ru \
              --bucket epg-mirror \
              --key "$filename" \
              --query 'Metadata.sha256' \
              --output text 2>/dev/null || true)

            if [ "$remote_hash" = "$hash" ] && [ "$FORCE_UPDATE" != "true" ]; then
              echo "$filename is unchanged in Cloud.ru."
              return
            fi

            echo "Uploading $filename to Cloud.ru..."

            if aws s3api put-object \
              --endpoint-url https://s3.cloud.ru \
              --bucket epg-mirror \
              --key "$filename" \
              --body "$local_file" \
              --content-type application/gzip \
              --cache-control "public, max-age=21600" \
              --metadata "sha256=$hash"; then
              echo "$filename uploaded successfully."
            else
              echo "ERROR uploading $filename to Cloud.ru."
              FAILED=1
            fi
          }

          if [ "${{ steps.download.outputs.epg1_ok }}" = "true" ]; then
            publish_one epg.xml.gz "${{ steps.download.outputs.epg1_sha }}"
          fi

          if [ "${{ steps.download.outputs.epg2_ok }}" = "true" ]; then
            publish_one edem.xml.gz "${{ steps.download.outputs.epg2_sha }}"
          fi

          exit "$FAILED"

      # Публикация в GitHub отдельной веткой без накопления истории.
     
      - name: Publish to GitHub mirror
        if: always() && steps.download.outcome == 'success'
        env:
          FORCE_UPDATE: ${{ github.event.inputs.force_update || 'false' }}
        shell: bash
        run: |
          set -euo pipefail

          OLD="$RUNNER_TEMP/epg-old"
          mkdir -p "$OLD"

          # Загружаем прежнюю версию ветки, если она существует.
          if git ls-remote --exit-code origin refs/heads/epg-data >/dev/null 2>&1; then
            git fetch origin \
              "+refs/heads/epg-data:refs/remotes/origin/epg-data"
            git archive origin/epg-data | tar -x -C "$OLD"
          fi

          # Удаляем из временной копии всё, кроме двух архивов и манифеста.
          find "$OLD" -mindepth 1 -maxdepth 1 \
            ! -name epg.xml.gz \
            ! -name edem.xml.gz \
            ! -name SHA256SUMS \
            -exec rm -rf -- {} +

          CHANGED=0

          EPG1_OK="${{ steps.download.outputs.epg1_ok }}"
          EPG2_OK="${{ steps.download.outputs.epg2_ok }}"

          update_one() {
            local ok="$1"
            local filename="$2"
            local hash="$3"
            local source="$RUNNER_TEMP/epg/$filename"
            local old_hash=""

            if [ "$ok" != "true" ]; then
              echo "$filename unavailable; retaining previous copy."
              return
            fi

            local size
            size=$(wc -c < "$source")

            if [ "$size" -ge 99000000 ]; then
              echo "WARNING: $filename exceeds the safe GitHub file-size limit."
              return
            fi

            if [ -f "$OLD/SHA256SUMS" ]; then
              old_hash=$(awk -v f="$filename" '$2 == f {print $1}' "$OLD/SHA256SUMS")
            fi

            if [ "$old_hash" = "$hash" ] && [ "$FORCE_UPDATE" != "true" ]; then
              echo "$filename is unchanged in GitHub."
              return
            fi

            cp "$source" "$OLD/$filename"
            CHANGED=1
            echo "$filename will be updated."
          }

          update_one "$EPG1_OK" epg.xml.gz \
            "${{ steps.download.outputs.epg1_sha }}"

          update_one "$EPG2_OK" edem.xml.gz \
            "${{ steps.download.outputs.epg2_sha }}"

          if [ ! -f "$OLD/epg.xml.gz" ] && [ ! -f "$OLD/edem.xml.gz" ]; then
            echo "No valid EPG files available for GitHub."
            exit 1
          fi

          # Создаём новый манифест только для имеющихся архивов.
          cd "$OLD"
          : > SHA256SUMS

          for file in epg.xml.gz edem.xml.gz; do
            if [ -f "$file" ]; then
              sha256sum "$file" >> SHA256SUMS
            fi
          done

          if [ "$CHANGED" -eq 0 ] && \
             git show-ref --verify --quiet refs/remotes/origin/epg-data; then
            echo "No GitHub EPG changes."
            exit 0
          fi

          cd "$GITHUB_WORKSPACE"

          git checkout --orphan epg-data

          # Полностью очищаем рабочую папку, сохраняя .git.
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 \
            ! -name .git \
            -exec rm -rf -- {} +

          cp "$OLD/epg.xml.gz" "$OLD/SHA256SUMS" .
          [ ! -f "$OLD/edem.xml.gz" ] || cp "$OLD/edem.xml.gz" .

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add epg.xml.gz edem.xml.gz SHA256SUMS 2>/dev/null || true
          git add -f SHA256SUMS

          echo "Files to publish:"
          git ls-files

          git commit -m "Update EPG mirror: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push --force origin HEAD:refs/heads/epg-data
